<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="840" fill="#f8fafc"/>

  <!-- docker network boundary -->
  <rect x="30" y="70" width="1140" height="740" rx="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="52" y="100" font-size="16" fill="#475569" font-weight="600">Docker network: mongodb-network</text>

  <!-- client -->
  <rect x="470" y="120" width="260" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="146" font-size="16" font-weight="700" text-anchor="middle" fill="#0c4a6e">Client / Application</text>
  <text x="600" y="166" font-size="12.5" text-anchor="middle" fill="#0c4a6e">mongodb://localhost:27100,localhost:27200</text>

  <!-- arrows client -> routers -->
  <line x1="560" y1="184" x2="380" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="184" x2="820" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- mongos routers -->
  <text x="600" y="228" font-size="14" text-anchor="middle" fill="#475569" font-weight="600">Mongos Routers</text>

  <rect x="260" y="250" width="240" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">mongos-router-1</text>
  <text x="380" y="300" font-size="12.5" text-anchor="middle" fill="#14532d">host port 27100</text>

  <rect x="700" y="250" width="240" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">mongos-router-2</text>
  <text x="820" y="300" font-size="12.5" text-anchor="middle" fill="#14532d">host port 27200</text>

  <!-- vertical bus from routers -->
  <line x1="380" y1="320" x2="380" y2="345" stroke="#334155" stroke-width="2"/>
  <line x1="820" y1="320" x2="820" y2="345" stroke="#334155" stroke-width="2"/>
  <line x1="380" y1="345" x2="820" y2="345" stroke="#334155" stroke-width="2"/>
  <line x1="600" y1="345" x2="600" y2="345" stroke="#334155" stroke-width="2"/>

  <!-- routing metadata arrow (dashed) to config servers -->
  <line x1="600" y1="345" x2="600" y2="404" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>
  <text x="612" y="380" font-size="12" fill="#64748b">routing metadata</text>

  <!-- data path arrows to shard groups -->
  <line x1="380" y1="345" x2="270" y2="600" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="345" x2="930" y2="600" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="470" font-size="12" fill="#334155">data (queries /</text>
  <text x="230" y="486" font-size="12" fill="#334155">writes)</text>
  <text x="945" y="470" font-size="12" fill="#334155">data (queries /</text>
  <text x="945" y="486" font-size="12" fill="#334155">writes)</text>

  <!-- config server replica set group -->
  <rect x="440" y="410" width="320" height="150" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="600" y="434" font-size="14" font-weight="700" text-anchor="middle" fill="#713f12">Config Server Replica Set</text>
  <text x="600" y="450" font-size="12" text-anchor="middle" fill="#713f12">mongo-config-server-rs</text>

  <rect x="456" y="466" width="90" height="76" rx="8" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="501" y="498" font-size="12.5" text-anchor="middle" fill="#713f12" font-weight="600">config-1</text>
  <text x="501" y="515" font-size="11.5" text-anchor="middle" fill="#713f12">port 27001</text>

  <rect x="555" y="466" width="90" height="76" rx="8" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="600" y="498" font-size="12.5" text-anchor="middle" fill="#713f12" font-weight="600">config-2</text>
  <text x="600" y="515" font-size="11.5" text-anchor="middle" fill="#713f12">port 27002</text>

  <rect x="654" y="466" width="90" height="76" rx="8" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="699" y="498" font-size="12.5" text-anchor="middle" fill="#713f12" font-weight="600">config-3</text>
  <text x="699" y="515" font-size="11.5" text-anchor="middle" fill="#713f12">port 27003</text>

  <!-- shard 1 replica set group -->
  <rect x="60" y="600" width="420" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="624" font-size="14" font-weight="700" text-anchor="middle" fill="#4c1d95">Shard 1 Replica Set</text>
  <text x="270" y="640" font-size="12" text-anchor="middle" fill="#4c1d95">mongo-shard1-rs</text>

  <rect x="80" y="656" width="112" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="136" y="688" font-size="12.5" text-anchor="middle" fill="#4c1d95" font-weight="600">shard1-1</text>
  <text x="136" y="705" font-size="11.5" text-anchor="middle" fill="#4c1d95">port 27101</text>

  <rect x="214" y="656" width="112" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="688" font-size="12.5" text-anchor="middle" fill="#4c1d95" font-weight="600">shard1-2</text>
  <text x="270" y="705" font-size="11.5" text-anchor="middle" fill="#4c1d95">port 27102</text>

  <rect x="348" y="656" width="112" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="404" y="688" font-size="12.5" text-anchor="middle" fill="#4c1d95" font-weight="600">shard1-3</text>
  <text x="404" y="705" font-size="11.5" text-anchor="middle" fill="#4c1d95">port 27103</text>

  <!-- shard 2 replica set group -->
  <rect x="720" y="600" width="420" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="930" y="624" font-size="14" font-weight="700" text-anchor="middle" fill="#4c1d95">Shard 2 Replica Set</text>
  <text x="930" y="640" font-size="12" text-anchor="middle" fill="#4c1d95">mongo-shard2-rs</text>

  <rect x="740" y="656" width="112" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="796" y="688" font-size="12.5" text-anchor="middle" fill="#4c1d95" font-weight="600">shard2-1</text>
  <text x="796" y="705" font-size="11.5" text-anchor="middle" fill="#4c1d95">port 27201</text>

  <rect x="874" y="656" width="112" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="930" y="688" font-size="12.5" text-anchor="middle" fill="#4c1d95" font-weight="600">shard2-2</text>
  <text x="930" y="705" font-size="11.5" text-anchor="middle" fill="#4c1d95">port 27202</text>

  <rect x="1008" y="656" width="112" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1064" y="688" font-size="12.5" text-anchor="middle" fill="#4c1d95" font-weight="600">shard2-3</text>
  <text x="1064" y="705" font-size="11.5" text-anchor="middle" fill="#4c1d95">port 27203</text>

  <!-- legend -->
  <line x1="60" y1="790" x2="100" y2="790" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="795" font-size="12.5" fill="#334155">data path</text>
  <line x1="220" y1="790" x2="260" y2="790" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>
  <text x="270" y="795" font-size="12.5" fill="#334155">routing metadata</text>
</svg>
